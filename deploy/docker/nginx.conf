# Container-internal vhost for the `nginx` service in docker-compose.yml.
# Unlike deploy/nginx/clinicnet-stom-asia (old shared-host vhost, one of
# several server blocks in one shared nginx), this is the WHOLE nginx
# config for a dedicated container — no wildcard-vhost precedence concern,
# no other apps to avoid disturbing.
#
# TLS cert path assumes deploy/docker/certbot/init-letsencrypt.sh has run
# once on this server (bootstraps a dummy cert so nginx can start, then
# swaps in the real Let's Encrypt one) — see docs/DEPLOY-DOCKER.md.

server {
    listen 80;
    listen [::]:80;
    server_name clinicnet.stom.asia;

    # certbot's webroot ACME challenge — must stay plain HTTP, unproxied,
    # for both the initial issuance and every renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name clinicnet.stom.asia;

    client_max_body_size 25M;

    ssl_certificate     /etc/letsencrypt/live/clinicnet.stom.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinicnet.stom.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Django's own collected static (admin CSS/JS etc — `collectstatic`),
    # NOT the Vue build (see /assets/ and the SPA fallback below). Shared
    # with the `web` container via the `static_volume` named volume.
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # API + Django admin -> gunicorn, reached by its compose service name
    # (`web`) over the compose network — not 127.0.0.1, there's no shared
    # host namespace between containers.
    location ~ ^/(api|admin)/ {
        proxy_pass http://web:8041;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    # Vue build — baked into this image at build time (see
    # nginx.Dockerfile's frontend-build stage), not a volume: a fresh
    # `docker compose build nginx && docker compose up -d nginx` is the
    # whole frontend deploy, same intent as the old deploy's `npm run
    # build` + copy-to-frontend-dist step, just moved into the image build.
    root /usr/share/nginx/html;
    location /assets/ {
        expires 30d;
        access_log off;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
